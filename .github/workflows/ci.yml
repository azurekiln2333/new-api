      - name: Test
        if: ${{ !cancelled() }}
        run: |
          LOG_FILE="$RUNNER_TEMP/frontend-tests.log"
          set +e
          bun run test 2>&1 | tee "$LOG_FILE"
          COMMAND_STATUS=("${PIPESTATUS[@]}")
          set -e
          if [ "${COMMAND_STATUS[0]}" -ne 0 ]; then
            python3 - "$LOG_FILE" <<'PY' || true
          import pathlib
          import re
          import sys

          output = pathlib.Path(sys.argv[1]).read_text(errors="replace")
          lines = re.sub(r"\x1b\[[0-?]*[ -/]*[@-~]", "", output).splitlines()
          if not lines:
              lines = ["Frontend test command failed without output."]
          summaries = [i for i, line in enumerate(lines) if re.search(r"Failed (?:Tests|Suites)|Unhandled Errors", line)]
          first_detail = min(summaries) if summaries else 0
          pattern = re.compile(r"\bFAIL\b|AssertionError:|TestingLibraryElementError:|Error:|Unhandled (?:Error|Rejection)|Failed Tests")
          matches = [i for i in range(first_detail, len(lines)) if pattern.search(lines[i])]
          if not matches:
              matches = [max(0, len(lines) - 20)]
          contexts = []
          for i in matches:
              if any(start <= i < end for start, end in contexts):
                  continue
              contexts.append((max(0, i - 2), min(len(lines), i + 35)))
          for start, end in contexts[:30]:
              message = f"Log lines {start + 1}-{end}:\n" + "\n".join(lines[start:end])
              message = message[:3500].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=Frontend test failure::{message}")
          if len(contexts) > 30:
              print(f"::error::{len(contexts) - 30} additional failure contexts are in the frontend-test-logs artifact")
          PY
          fi
          if [ "${COMMAND_STATUS[0]}" -ne 0 ]; then
            exit "${COMMAND_STATUS[0]}"
          fi
          exit "${COMMAND_STATUS[1]}"

      - name: Upload frontend test logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-test-logs-${{ github.sha }}
          path: ${{ runner.temp }}/frontend-tests.log
          if-no-files-found: warn

      - name: Build production frontend
        if: ${{ !cancelled() }}
        run: bun run build

      - name: Capture complete frontend formatter patch after validation
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          mapfile -d '' FILES < <(git -C .. diff --name-only --diff-filter=ACMR -z "$CI_DIFF_BASE" "$GITHUB_SHA" -- 'web/**' | sort -zu)
          for INDEX in "${!FILES[@]}"; do
            FILES[$INDEX]="${FILES[$INDEX]#web/}"
          done
          if [ "${#FILES[@]}" -gt 0 ]; then
            bun run format -- "${FILES[@]}"
            mkdir -p "$RUNNER_TEMP/frontend-format"
            git rev-parse HEAD > "$RUNNER_TEMP/frontend-format/source-sha.txt"
            git -C .. diff --binary -- web > "$RUNNER_TEMP/frontend-format/format.patch"
          fi

      - name: Upload complete frontend formatter patch
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-format-${{ github.sha }}
          path: ${{ runner.temp }}/frontend-format/
          if-no-files-found: ignore
