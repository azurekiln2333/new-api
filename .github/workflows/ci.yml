              expected["race"].update(f"{prefix}/overflow_does_not_commit_any_target_or_marker/{table}" for table in ("usage_channels", "usage_channel_models", "usage_hours"))
          report = {"source_sha": source_sha, "scope": "foundation schema and in-process concurrency/recovery", "passed": {}}
          for label, required in expected.items():
              passed = collections.Counter()
              skipped = []
              for line in (output / f"{label}.jsonl").read_text().splitlines():
                  try:
                      event = json.loads(line)
