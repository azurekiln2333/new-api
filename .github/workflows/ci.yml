          for engine in ("sqlite", "mysql", "postgres"):
              expected["schema"].add(f"TestMigrationSchemaStability/{engine}/usage_statistics_foundation")
              prefix = f"TestUsageEventFoundationDatabaseMatrix/{engine}"
              expected["race"].add(prefix)
              expected["race"].update(f"{prefix}/{case}" for case in cases)
