name: CI

on:
  push:
    branches: [merge/upstream]
  pull_request:
    types: [opened, synchronize, closed]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Checkout the event commit in every job. A PR merge ref can disappear while
# queued runs start, and a base branch can advance after the merge event.
jobs:
  backend:
    name: Backend vet, build, and test
    if: github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOWORK: 'off'

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.event.pull_request.base.repo.full_name || github.repository }}
          ref: ${{ github.sha }}

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            relaykit/go.sum
            tokenkit/go.sum

      - name: Create frontend embed placeholder
        run: |
          mkdir -p web/dist
          touch web/dist/index.html

      - name: Vet root module
        run: go vet ./...

      - name: Vet relaykit independently
        working-directory: relaykit
        run: go vet ./...

      - name: Vet tokenkit independently
        working-directory: tokenkit
        run: go vet ./...

      - name: Build root module
        run: go build ./...

      - name: Build relaykit independently
        working-directory: relaykit
        run: go build ./...

      - name: Build tokenkit independently
        working-directory: tokenkit
        run: go build ./...

      - name: Test root, relaykit, and tokenkit modules
        run: make test

  relay_policy_integration:
    name: Relay policy database and Redis integration
    if: github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOWORK: 'off'
      TEST_MYSQL_DSN: 'root:integration@tcp(127.0.0.1:3306)/relay_policy?charset=utf8mb4&parseTime=True&loc=Local'
      TEST_POSTGRES_DSN: 'postgres://postgres:integration@127.0.0.1:5432/relay_policy?sslmode=disable'
      TEST_REDIS_ADDR: '127.0.0.1:6379'
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: integration
          MYSQL_DATABASE: relay_policy
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pintegration"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: integration
          POSTGRES_DB: relay_policy
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d relay_policy"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      redis:
        image: redis:7.4
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=12
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.event.pull_request.base.repo.full_name || github.repository }}
          ref: ${{ github.sha }}

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            relaykit/go.sum
            tokenkit/go.sum

      - name: Record database and Redis versions
        run: |
          docker exec ${{ job.services.mysql.id }} mysql -uroot -pintegration -N -e 'SELECT VERSION()'
          docker exec ${{ job.services.postgres.id }} psql -U postgres -d relay_policy -Atc 'SELECT VERSION()'
          docker exec ${{ job.services.redis.id }} redis-server --version

      # These packages use process-wide fixtures. Keep them sequential against
      # the isolated service databases, and require configured external engines.
      - name: Verify database contracts, channel settings and relay policies
        run: go test -p 1 -count=1 -v ./model ./service ./controller

      - name: Verify scheduled channel locks on MySQL and PostgreSQL
        run: |
          for DIALECT in mysql postgres; do
            TEST_TASK_DB_DIALECT=$DIALECT go test -p 1 -count=1 -v ./model -run 'TestScheduledChannel'
            TEST_TASK_DB_DIALECT=$DIALECT go test -p 1 -count=1 -v ./controller -run 'TestExecuteTaskSubmission|TestImmediateTaskSettlementDatabase'
          done

      - name: Verify channel configuration and key binding on MySQL and PostgreSQL
        run: |
          for CHANNEL_TEST_DSN in "$TEST_MYSQL_DSN" "$TEST_POSTGRES_DSN"; do
            TEST_CHANNEL_SQL_DSN="$CHANNEL_TEST_DSN" go test -p 1 -count=1 -v ./controller -run 'TestChannelSupportedEndpointsPersistThroughCreateAndUpdate|TestMultiKeyEnableRestoresOnlyExhaustedChannels|TestUpdateChannelKeepsCurrentKeyState|TestUpdateChannelConvertsSingleKeyChannel|TestMultiKeyManageKeepsKeyScopesOnTheirKey|TestMultiKeyModelSyncPreviewAndApply|TestGetChannelConcurrency|TestPlaygroundChannelNavigationAuthorizationAndRouting|TestFingerprintResponsesOnlyChannelProbe'
          done

      - name: Verify login avatar updates on MySQL and PostgreSQL
        run: |
          for DIALECT in mysql postgres; do
            TEST_SECURITY_DIALECT=$DIALECT go test -p 1 -count=1 -v ./controller -run 'TestOAuthLogin.*Avatar|TestUserSettingsPreserveProviderAvatar|TestSecurityLogin'
          done

      - name: Verify API key rotation and custom keys on MySQL and PostgreSQL
        run: |
          for DIALECT in mysql postgres; do
            TEST_SECURITY_DIALECT=$DIALECT go test -p 1 -count=1 -v ./controller -run 'TestNormalizeCustomTokenKey|TestRotateTokenKey|TestAddToken.*CustomKey|TestTokenKeyUniquenessErrorsStayValueFree'
          done

      - name: Verify per-turn goal routing and channel waiting on MySQL and PostgreSQL
        run: |
          for RESPONSES_TEST_DSN in "$TEST_MYSQL_DSN" "$TEST_POSTGRES_DSN"; do
            TEST_RESPONSES_SQL_DSN="$RESPONSES_TEST_DSN" TEST_RESPONSES_LOG_SQL_DSN="$RESPONSES_TEST_DSN" go test -p 1 -count=1 -v ./controller -run 'TestResponsesWebSocketGoalPolicyIsPerTurn|TestGoalTurnPolicyRouting|TestRequestPolicyUpstreamHTTPFailover|TestChannelWaitRouting'
          done

      - name: Check admission, waiting, streaming and timeout races
        env:
          CGO_ENABLED: '1'
        run: go test -race -p 1 -count=1 ./service ./controller ./relay/channel ./relay/helper ./relay/channel/openai -run 'ChannelCapacity|ChannelWait|StreamCommit|StreamComment|OaiResponsesStreamHandler|ConvertedStream|ResponsesFailedWork|ResponsesPostOutputTruncation|UpstreamFirstByte|FirstByteTimeout|APIAndFormRequestsInheritClientCancellation|Fingerprint'

  frontend:
    name: Frontend typecheck, test, and build
    if: github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.event.pull_request.base.repo.full_name || github.repository }}
          ref: ${{ github.sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun check -b

      - name: Lint updated console flows
        run: >-
          bun x --no-install oxlint -c .oxlintrc.json
          src/features/keys/components/api-key-rotate-dialog.tsx
          src/features/keys/components/__tests__/api-key-rotate-dialog.test.tsx
          src/features/channels/components/channel-card.tsx
          src/features/channels/components/channel-usage-context.tsx
          src/features/channels/components/__tests__/channel-details-entry.test.tsx
          src/features/channels/hooks/__tests__/use-channel-usage.test.tsx
          src/features/playground/api.ts
          src/features/playground/hooks/use-playground-options.ts
          src/features/playground/hooks/use-playground-state.ts
          src/features/playground/lib/options/playground-option-utils.ts
          src/features/playground/hooks/__tests__/use-playground-options.test.tsx
          src/features/playground/hooks/__tests__/use-playground-state.test.ts
          src/features/usage-logs/components/columns/column-helpers.tsx
          src/features/usage-logs/components/columns/common-logs-columns.tsx
          src/features/usage-logs/components/common-log-mobile-card.tsx
          src/features/usage-logs/components/common-log-mobile-row.tsx
          src/features/usage-logs/components/common-logs-stats.tsx
          src/features/usage-logs/components/dialogs/details-dialog.tsx
          src/features/usage-logs/components/__tests__/common-logs-stats.test.tsx
          src/features/usage-logs/components/__tests__/mobile-card.test.tsx
          src/features/usage-logs/components/__tests__/usage-facts.test.tsx
          src/features/usage-logs/lib/format.ts

      - name: Test
        run: bun run test

      - name: Build production frontend
        run: bun run build
