name: CI

on:
  push:
    branches: [merge/upstream, fix/console-responsiveness-20261124, fix/login-session-recovery-20261125]
  pull_request:
    types: [opened, synchronize, closed]
  workflow_call:

permissions:
  contents: read

env:
  CI_DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
  CI_PR_BASE: ${{ github.event.pull_request.base.sha }}
  CI_PUSH_BASE: ${{ github.event.before }}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Checkout the event commit in every job. A PR merge ref can disappear while
# queued runs start, and a base branch can advance after the merge event.
jobs:
  backend:
    name: Backend vet, build, and test
    if: github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOWORK: 'off'

    steps:
      - name: Checkout
        id: backend_checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.event.pull_request.base.repo.full_name || github.repository }}
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Determine complete change scope
        run: bash .github/scripts/check-scope.sh

      - name: Set up Go
        id: backend_setup_go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            relaykit/go.sum
            tokenkit/go.sum

      - name: Create frontend embed placeholder
        id: backend_embed
        run: |
          mkdir -p web/dist
          touch web/dist/index.html

      - name: Check changed Go formatting
        run: |
          FILES=$(git diff --name-only --diff-filter=ACMR -z "$CI_DIFF_BASE" "$GITHUB_SHA" -- '*.go' | sort -zu | xargs -0 -r gofmt -l)
          if [ -n "$FILES" ]; then
            mkdir -p "$RUNNER_TEMP/go-format"
            git rev-parse HEAD > "$RUNNER_TEMP/go-format/source-sha.txt"
            while IFS= read -r FILE; do
              printf '::error file=%s::Go file requires gofmt\n' "$FILE"
              gofmt -d "$FILE" >> "$RUNNER_TEMP/go-format/format.patch"
              # The check has already failed; collect any diff before exiting.
              FORMAT_DIFF=$(gofmt -d "$FILE") || true
              if [ "${#FORMAT_DIFF}" -gt 5000 ]; then
                FORMAT_DIFF="${FORMAT_DIFF:0:5000}"$'\n[Formatter diff truncated after 5000 characters]'
              fi
              FORMAT_DIFF="${FORMAT_DIFF//%/%25}"
              FORMAT_DIFF="${FORMAT_DIFF//$'\r'/%0D}"
              FORMAT_DIFF="${FORMAT_DIFF//$'\n'/%0A}"
              printf '::notice file=%s,title=Go formatter diff::%s\n' "$FILE" "$FORMAT_DIFF"
            done <<< "$FILES"
            exit 1
          fi

      - name: Upload complete Go formatter diff
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-format-${{ github.sha }}
          path: ${{ runner.temp }}/go-format/
          if-no-files-found: ignore

      - name: Vet root module
        if: ${{ !cancelled() && steps.backend_checkout.outcome == 'success' && steps.backend_setup_go.outcome == 'success' && steps.backend_embed.outcome == 'success' }}
        run: go vet ./...

      - name: Vet relaykit independently
        if: ${{ !cancelled() && steps.backend_checkout.outcome == 'success' && steps.backend_setup_go.outcome == 'success' }}
        working-directory: relaykit
        run: go vet ./...

      - name: Vet tokenkit independently
        if: ${{ !cancelled() && steps.backend_checkout.outcome == 'success' && steps.backend_setup_go.outcome == 'success' }}
        working-directory: tokenkit
        run: go vet ./...

      - name: Build root module
        if: ${{ !cancelled() && steps.backend_checkout.outcome == 'success' && steps.backend_setup_go.outcome == 'success' && steps.backend_embed.outcome == 'success' }}
        run: go build ./...

      - name: Build relaykit independently
        if: ${{ !cancelled() && steps.backend_checkout.outcome == 'success' && steps.backend_setup_go.outcome == 'success' }}
        working-directory: relaykit
        run: go build ./...

      - name: Build tokenkit independently
        if: ${{ !cancelled() && steps.backend_checkout.outcome == 'success' && steps.backend_setup_go.outcome == 'success' }}
        working-directory: tokenkit
        run: go build ./...

      - name: Test root, relaykit, and tokenkit modules
        if: ${{ !cancelled() && steps.backend_checkout.outcome == 'success' && steps.backend_setup_go.outcome == 'success' && steps.backend_embed.outcome == 'success' }}
        run: |
          LOG_FILE="$RUNNER_TEMP/backend-tests.log"
          set +e
          make test 2>&1 | tee "$LOG_FILE"
          COMMAND_STATUS=("${PIPESTATUS[@]}")
          set -e
          if [ "${COMMAND_STATUS[0]}" -ne 0 ]; then
            python3 - "$LOG_FILE" <<'PY' || true
          import pathlib
          import re
          import sys

          lines = pathlib.Path(sys.argv[1]).read_text(errors="replace").splitlines()
          if not lines:
              lines = ["Test command failed without output; inspect the step exit code."]
          detail_pattern = re.compile(r"^\s*Error:|panic:|fatal error:|\.go:\d+:\d+:")
          pattern = re.compile(r"--- FAIL:|^FAIL(?:\s|$)|panic:|fatal error:|\.go:\d+:\d+:|^\s*(?:Error Trace|Error|Messages):")
          matches = [i for i, line in enumerate(lines) if pattern.search(line)]
          if not matches:
              matches = [max(0, len(lines) - 12)]
          matches.sort(key=lambda i: not bool(detail_pattern.search(lines[i])))
          contexts = []
          for i in matches:
              if any(start <= i < end for start, end in contexts):
                  continue
              start = max(0, i - 3)
              end = min(len(lines), i + 18)
              contexts.append((start, end))
          for start, end in contexts[:30]:
              message = f"Log lines {start + 1}-{end}:\n" + "\n".join(lines[start:end])
              message = message[:2500].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=Backend test failure::{message}")
          if len(contexts) > 30:
              print(f"::error::{len(contexts) - 30} additional failure contexts are in the backend-test-logs artifact")
          PY
          fi
          if [ "${COMMAND_STATUS[0]}" -ne 0 ]; then
            exit "${COMMAND_STATUS[0]}"
          fi
          exit "${COMMAND_STATUS[1]}"

      - name: Upload backend test logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-test-logs-${{ github.sha }}
          path: ${{ runner.temp }}/backend-tests.log
          if-no-files-found: warn

  relay_policy_integration:
    name: Relay policy, request logs, and database integration
    if: github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GOWORK: 'off'
      TEST_MYSQL_DSN: 'root:integration@tcp(127.0.0.1:3306)/relay_policy?charset=utf8mb4&parseTime=True&loc=Local'
      TEST_POSTGRES_DSN: 'postgres://postgres:integration@127.0.0.1:5432/relay_policy?sslmode=disable'
      TEST_CLICKHOUSE_DSN: 'clickhouse://default:integration@127.0.0.1:9000/relay_policy'
      TEST_FIXED_MYSQL_DSN: 'root:integration@tcp(127.0.0.1:3306)/usage_reporting?charset=utf8mb4&parseTime=True&loc=Local'
      TEST_FIXED_MYSQL_LOG_DSN: 'root:integration@tcp(127.0.0.1:3306)/usage_reporting_log?charset=utf8mb4&parseTime=True&loc=Local'
      TEST_FIXED_POSTGRES_DSN: 'postgres://postgres:integration@127.0.0.1:5432/usage_reporting?sslmode=disable'
      TEST_FIXED_POSTGRES_LOG_DSN: 'postgres://postgres:integration@127.0.0.1:5432/usage_reporting_log?sslmode=disable'
      TEST_REDIS_ADDR: '127.0.0.1:6379'
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: integration
          MYSQL_DATABASE: relay_policy
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pintegration"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: integration
          POSTGRES_DB: relay_policy
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d relay_policy"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      redis:
        image: redis:7.4
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=12
      clickhouse:
        image: clickhouse/clickhouse-server:25.8
        env:
          CLICKHOUSE_DB: relay_policy
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: integration
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: '1'
        ports:
          - 9000:9000
        options: >-
          --health-cmd="clickhouse-client --user default --password integration --query 'SELECT 1'"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    steps:
      - name: Checkout
        id: integration_checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.event.pull_request.base.repo.full_name || github.repository }}
          ref: ${{ github.sha }}

      - name: Set up Go
        id: integration_setup_go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            relaykit/go.sum
            tokenkit/go.sum

      - name: Record database and Redis versions
        run: |
          CI_MYSQL_VERSION=$(docker exec ${{ job.services.mysql.id }} mysql -uroot -pintegration -N -e 'SELECT VERSION()')
          printf '::notice title=MySQL version::%s\n' "$CI_MYSQL_VERSION"
          CI_POSTGRES_VERSION=$(docker exec ${{ job.services.postgres.id }} psql -U postgres -d relay_policy -Atc 'SELECT VERSION()')
          printf '::notice title=PostgreSQL version::%s\n' "$CI_POSTGRES_VERSION"
          CI_REDIS_VERSION=$(docker exec ${{ job.services.redis.id }} redis-server --version)
          printf '::notice title=Redis version::%s\n' "$CI_REDIS_VERSION"
          CI_CLICKHOUSE_VERSION=$(docker exec ${{ job.services.clickhouse.id }} clickhouse-client --user default --password integration --query 'SELECT version()')
          printf '::notice title=ClickHouse version::%s\n' "$CI_CLICKHOUSE_VERSION"

      - name: Prepare fixed usage reporting databases
        run: |
          docker exec ${{ job.services.mysql.id }} mysql -uroot -pintegration -e "CREATE DATABASE IF NOT EXISTS usage_reporting CHARACTER SET utf8mb4; CREATE DATABASE IF NOT EXISTS usage_reporting_log CHARACTER SET utf8mb4"
          for DATABASE_NAME in usage_reporting usage_reporting_log; do
            if ! docker exec ${{ job.services.postgres.id }} psql -U postgres -d postgres -Atc "SELECT 1 FROM pg_database WHERE datname = '$DATABASE_NAME'" | grep -q '^1$'; then
              docker exec ${{ job.services.postgres.id }} psql -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE $DATABASE_NAME"
            fi
          done

      - name: Verify fresh and latest-release startup twice with separate log stores
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_TYPE: master
          LOG_SQL_CLICKHOUSE_TTL_DAYS: '0'
        run: |
          set -o pipefail
          OUTPUT_DIR="$RUNNER_TEMP/released-migration"
          LOG_FILE="$OUTPUT_DIR/migration.log"
          RELEASED_DIR="$RUNNER_TEMP/released-baseline"
          mkdir -p "$OUTPUT_DIR/logs"

          echo "Current source: $(git rev-parse HEAD)" | tee -a "$LOG_FILE"
          gh api repos/azurekiln2333/new-api/releases/latest > "$OUTPUT_DIR/latest-release.json"
          jq -e '.draft == false and .prerelease == false and .published_at != null' \
            "$OUTPUT_DIR/latest-release.json"
          RELEASED_BASELINE_TAG=$(jq -er '.tag_name' "$OUTPUT_DIR/latest-release.json")
          git fetch --no-tags https://github.com/azurekiln2333/new-api.git "refs/tags/$RELEASED_BASELINE_TAG"
          RELEASED_BASELINE_SHA=$(git rev-parse 'FETCH_HEAD^{commit}')
          echo "Released source: $RELEASED_BASELINE_SHA tag=$RELEASED_BASELINE_TAG" | tee -a "$LOG_FILE"
          git worktree add --detach "$RELEASED_DIR" "$RELEASED_BASELINE_SHA"
          mkdir -p "$RELEASED_DIR/.github/scripts"
          cp .github/scripts/released_migration_probe.go "$RELEASED_DIR/.github/scripts/"

          run_probe() {
            local source_dir="$1" phase="$2" scenario="$3" dsn="$4" sqlite_path="$5"
            local log_dsn="$6" log_dialect="$7" shared="$8"
            local source_sha="$RELEASED_BASELINE_SHA"
            if [ "$source_dir" = "$GITHUB_WORKSPACE" ]; then
              source_sha="$(git rev-parse HEAD)"
            fi
            echo "Invoking model.InitDB + model.InitLogDB: source=$source_sha scenario=$scenario phase=$phase log=$log_dialect shared=$shared" | tee -a "$LOG_FILE"
            echo "COMMAND: (cd $source_dir && SQL_DSN=<isolated DSN> LOG_SQL_DSN=<isolated DSN or shared> SQLITE_PATH=$sqlite_path REDEMPTION_INDEX_MANIFEST=$OUTPUT_DIR/$scenario.legacy.json MIGRATION_USAGE_MANIFEST=$OUTPUT_DIR/$scenario.usage.json MIGRATION_LOG_DIALECT=$log_dialect MIGRATION_SHARED_LOG=$shared MIGRATION_LOG_DIR=$OUTPUT_DIR/logs/$scenario-$phase go run .github/scripts/released_migration_probe.go $phase)" | tee -a "$LOG_FILE"
            set +e
            (
              cd "$source_dir" || exit
              SQL_DSN="$dsn" \
              LOG_SQL_DSN="$log_dsn" \
              SQLITE_PATH="$sqlite_path" \
              REDEMPTION_INDEX_MANIFEST="$OUTPUT_DIR/$scenario.legacy.json" \
              MIGRATION_USAGE_MANIFEST="$OUTPUT_DIR/$scenario.usage.json" \
              MIGRATION_LOG_DIALECT="$log_dialect" \
              MIGRATION_SHARED_LOG="$shared" \
              MIGRATION_LOG_DIR="$OUTPUT_DIR/logs/$scenario-$phase" \
              go run .github/scripts/released_migration_probe.go "$phase"
            ) 2>&1 | tee -a "$LOG_FILE"
            probe_status=("${PIPESTATUS[@]}")
            set -e
            if [ "${probe_status[0]}" -ne 0 ]; then
              failure_context="$(tail -n 20 "$LOG_FILE")"
              failure_context="${failure_context: -2000}"
              failure_context="${failure_context//%/%25}"
              failure_context="${failure_context//$'\r'/%0D}"
              failure_context="${failure_context//$'\n'/%0A}"
              printf '::error title=Startup migration failure::scenario=%s phase=%s source=%s%%0A%s\n' "$scenario" "$phase" "$source_sha" "$failure_context"
              return "${probe_status[0]}"
            fi
            if [ "${probe_status[1]}" -ne 0 ]; then
              return "${probe_status[1]}"
            fi
            printf '%s\t%s\t%s\n' "$scenario" "$phase" "$source_sha" >> "$OUTPUT_DIR/completed.tsv"
          }

          create_store() {
            local engine="$1" name="$2"
            case "$engine" in
              sqlite)
                printf 'local'
                ;;
              mysql)
                docker exec ${{ job.services.mysql.id }} mysql -uroot -pintegration -e "CREATE DATABASE $name CHARACTER SET utf8mb4" > /dev/null || return
                printf 'root:integration@tcp(127.0.0.1:3306)/%s?charset=utf8mb4&parseTime=True&loc=Local' "$name"
                ;;
              postgres)
                docker exec ${{ job.services.postgres.id }} psql -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE $name" > /dev/null || return
                printf 'postgres://postgres:integration@127.0.0.1:5432/%s?sslmode=disable' "$name"
                ;;
              clickhouse)
                docker exec ${{ job.services.clickhouse.id }} clickhouse-client --user default --password integration --query "CREATE DATABASE $name" > /dev/null || return
                printf 'clickhouse://default:integration@127.0.0.1:9000/%s' "$name"
                ;;
              *) return 1 ;;
            esac
          }

          # local opens SQLITE_PATH for both stores when primary is SQLite.
          # Use a MySQL primary to exercise a genuinely separate SQLite LOG_DB.
          for topology in sqlite-shared mysql-shared postgres-shared mysql-sqlite mysql-mysql postgres-postgres sqlite-clickhouse; do
            primary_engine="${topology%%-*}"
            log_engine="${topology#*-}"
            for installation in fresh upgrade; do
              scenario="$topology-$installation"
              database_name="migration_${scenario//-/_}"
              primary_dsn="$(create_store "$primary_engine" "${database_name}_primary")"
              sqlite_path="$OUTPUT_DIR/$scenario.sqlite"
              shared=false
              if [ "$log_engine" = shared ]; then
                log_dsn=''
                log_dialect="$primary_engine"
                shared=true
              else
                log_dsn="$(create_store "$log_engine" "${database_name}_log")"
                log_dialect="$log_engine"
              fi
              if [ "$installation" = upgrade ]; then
                run_probe "$RELEASED_DIR" seed "$scenario" "$primary_dsn" "$sqlite_path" "$log_dsn" "$log_dialect" "$shared"
              fi
              run_probe "$GITHUB_WORKSPACE" "$installation-first" "$scenario" "$primary_dsn" "$sqlite_path" "$log_dsn" "$log_dialect" "$shared"
              run_probe "$GITHUB_WORKSPACE" "$installation-second" "$scenario" "$primary_dsn" "$sqlite_path" "$log_dsn" "$log_dialect" "$shared"
            done
          done
          python3 - "$OUTPUT_DIR" "$(git rev-parse HEAD)" "$RELEASED_BASELINE_SHA" <<'PY'
          import json
          import pathlib
          import sys

          output, current_sha, released_sha = pathlib.Path(sys.argv[1]), sys.argv[2], sys.argv[3]
          topologies = ("sqlite-shared", "mysql-shared", "postgres-shared", "mysql-sqlite", "mysql-mysql", "postgres-postgres", "sqlite-clickhouse")
          expected = set()
          for topology in topologies:
              for installation in ("fresh", "upgrade"):
                  scenario = f"{topology}-{installation}"
                  for phase in (f"{installation}-first", f"{installation}-second"):
                      expected.add((scenario, phase, current_sha))
                  if installation == "upgrade":
                      expected.add((scenario, "seed", released_sha))
          actual = [tuple(line.split("\t")) for line in (output / "completed.tsv").read_text().splitlines()]
          if len(actual) != len(expected) or set(actual) != expected:
              raise SystemExit(f"Incomplete startup matrix: missing={expected - set(actual)}, unexpected={set(actual) - expected}")
          report = {"scope": "usage event/projection/lineage/coverage/backfill physical schema; behavioral and end-to-end gates remain separate", "current_sha": current_sha, "released_sha": released_sha, "completed": sorted(actual)}
          (output / "matrix-report.json").write_text(json.dumps(report, indent=2) + "\n")
          print(f"Verified {len(actual)} startup invocations, including both current startups in every fresh/upgrade topology")
          PY

      - name: Upload released migration logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: released-baseline-migration-${{ github.sha }}
          path: ${{ runner.temp }}/released-migration/
          if-no-files-found: warn

      # These packages use process-wide fixtures. Keep them sequential against
      # the isolated service databases, and require configured external engines.
      - name: Verify database contracts, channel settings and relay policies
        if: ${{ !cancelled() && steps.integration_checkout.outcome == 'success' && steps.integration_setup_go.outcome == 'success' }}
        env:
          AUDIT_MYSQL_DSN: ${{ env.TEST_MYSQL_DSN }}
          AUDIT_POSTGRES_DSN: ${{ env.TEST_POSTGRES_DSN }}
          AUDIT_CLICKHOUSE_DSN: ${{ env.TEST_CLICKHOUSE_DSN }}
        run: |
          # Audit fixtures use their own names; missing aliases must fail this
          # required hosted matrix rather than silently skipping real engines.
          : "${AUDIT_MYSQL_DSN:?Required MySQL audit fixture DSN is missing}"
          : "${AUDIT_POSTGRES_DSN:?Required PostgreSQL audit fixture DSN is missing}"
          : "${AUDIT_CLICKHOUSE_DSN:?Required ClickHouse audit fixture DSN is missing}"
          LOG_FILE="$RUNNER_TEMP/database-integration-tests.log"
          set +e
          go test -p 1 -count=1 -v ./model ./service ./controller 2>&1 | tee "$LOG_FILE"
          COMMAND_STATUS=("${PIPESTATUS[@]}")
          set -e
          if [ "${COMMAND_STATUS[0]}" -ne 0 ]; then
            python3 - "$LOG_FILE" <<'PY' || true
          import pathlib
          import re
          import sys

          lines = pathlib.Path(sys.argv[1]).read_text(errors="replace").splitlines()
          if not lines:
              lines = ["Test command failed without output; inspect the step exit code."]
          detail_pattern = re.compile(r"^\s*Error:|panic:|fatal error:|\.go:\d+:\d+:")
          pattern = re.compile(r"--- FAIL:|^FAIL(?:\s|$)|panic:|fatal error:|\.go:\d+:\d+:|^\s*(?:Error Trace|Error|Messages):")
          matches = [i for i, line in enumerate(lines) if pattern.search(line)]
          if not matches:
              matches = [max(0, len(lines) - 12)]
          matches.sort(key=lambda i: not bool(detail_pattern.search(lines[i])))
          contexts = []
          for i in matches:
              if any(start <= i < end for start, end in contexts):
                  continue
              start = max(0, i - 3)
              end = min(len(lines), i + 18)
              contexts.append((start, end))
          for start, end in contexts[:30]:
              message = f"Log lines {start + 1}-{end}:\n" + "\n".join(lines[start:end])
              message = message[:2500].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=Database integration failure::{message}")
          if len(contexts) > 30:
              print(f"::error::{len(contexts) - 30} additional failure contexts are in the database-integration-test-logs artifact")
          PY
          fi
          if [ "${COMMAND_STATUS[0]}" -ne 0 ]; then
            exit "${COMMAND_STATUS[0]}"
          fi
          exit "${COMMAND_STATUS[1]}"

      - name: Upload database integration test logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: database-integration-test-logs-${{ github.sha }}
          path: ${{ runner.temp }}/database-integration-tests.log
          if-no-files-found: warn

      - name: Verify scheduled channel locks on MySQL and PostgreSQL
        if: ${{ !cancelled() && steps.integration_checkout.outcome == 'success' && steps.integration_setup_go.outcome == 'success' }}
        run: |
          for DIALECT in mysql postgres; do
            TEST_TASK_DB_DIALECT=$DIALECT go test -p 1 -count=1 -v ./model -run 'TestScheduledChannel'
            TEST_TASK_DB_DIALECT=$DIALECT go test -p 1 -count=1 -v ./controller -run 'TestExecuteTaskSubmission|TestImmediateTaskSettlementDatabase|TestTaskSubmissionCommits|TestLedgerTaskSubmission|TestLegacyTaskSubmission'
          done

      - name: Verify model availability observations on SQLite, MySQL and PostgreSQL
        if: ${{ !cancelled() && steps.integration_checkout.outcome == 'success' && steps.integration_setup_go.outcome == 'success' }}
        run: |
          for DIALECT in sqlite mysql postgres; do
            TEST_TASK_DB_DIALECT=$DIALECT go test -p 1 -count=1 -v ./model -run '^TestChannelModelUnavailability$'
          done

      - name: Verify channel configuration and key binding on MySQL and PostgreSQL
        if: ${{ !cancelled() && steps.integration_checkout.outcome == 'success' && steps.integration_setup_go.outcome == 'success' }}
        run: |
          for CHANNEL_TEST_DSN in "$TEST_MYSQL_DSN" "$TEST_POSTGRES_DSN"; do
            TEST_CHANNEL_SQL_DSN="$CHANNEL_TEST_DSN" go test -p 1 -count=1 -v ./controller -run 'TestChannelSupportedEndpointsPersistThroughCreateAndUpdate|TestMultiKeyEnableRestoresOnlyExhaustedChannels|TestUpdateChannelKeepsCurrentKeyState|TestUpdateChannelConvertsSingleKeyChannel|TestMultiKeyManageKeepsKeyScopesOnTheirKey|TestMultiKeyModelDiscoveryUsesOneKey|TestMultiKeyModelSyncPreviewAndApply|TestGetChannelConcurrency|TestFingerprintResponsesOnlyChannelProbe'
          done

      - name: Verify Playground channel authorization and projection on SQLite, MySQL and PostgreSQL
