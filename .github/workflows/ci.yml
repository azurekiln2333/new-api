                  if event.get("Package") != "github.com/QuantumNous/new-api/model":
                      continue
                  name, action = event.get("Test", ""), event.get("Action")
                  if action == "pass":
                      passed[name] += 1
                  elif action in ("skip", "fail"):
                      skipped.append((name, action))
              missing = sorted(name for name in required if passed[name] != 1)
              if missing or skipped:
                  raise SystemExit(f"{label}: missing/repeated required passes={missing}; skipped/failed={skipped}")
              report["passed"][label] = sorted(required)
          (output / "required-branches.json").write_text(json.dumps(report, indent=2) + "\n")
