name: CI

on:
  push:
    branches: [merge/upstream, fix/console-responsiveness-20261124]
  pull_request:
    types: [opened, synchronize, closed]
  workflow_call:

permissions:
  contents: read

env:
  CI_DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
  CI_PR_BASE: ${{ github.event.pull_request.base.sha }}
  CI_PUSH_BASE: ${{ github.event.before }}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Checkout the event commit in every job. A PR merge ref can disappear while
# queued runs start, and a base branch can advance after the merge event.
jobs:
  backend:
    name: Backend vet, build, and test
    if: github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOWORK: 'off'

    steps:
      - name: Checkout
        id: backend_checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.event.pull_request.base.repo.full_name || github.repository }}
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Determine complete change scope
        run: bash .github/scripts/check-scope.sh

      - name: Set up Go
        id: backend_setup_go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            relaykit/go.sum
            tokenkit/go.sum

      - name: Create frontend embed placeholder
        id: backend_embed
        run: |
          mkdir -p web/dist
          touch web/dist/index.html

      - name: Check changed Go formatting
        run: |
          FILES=$(git diff --name-only --diff-filter=ACMR -z "$CI_DIFF_BASE" "$GITHUB_SHA" -- '*.go' | sort -zu | xargs -0 -r gofmt -l)
          if [ -n "$FILES" ]; then
            while IFS= read -r FILE; do
              printf '::error file=%s::Go file requires gofmt\n' "$FILE"
              # The check has already failed; collect any diff before exiting.
              FORMAT_DIFF=$(gofmt -d "$FILE") || true
              if [ "${#FORMAT_DIFF}" -gt 5000 ]; then
                FORMAT_DIFF="${FORMAT_DIFF:0:5000}"$'\n[Formatter diff truncated after 5000 characters]'
              fi
              FORMAT_DIFF="${FORMAT_DIFF//%/%25}"
              FORMAT_DIFF="${FORMAT_DIFF//$'\r'/%0D}"
              FORMAT_DIFF="${FORMAT_DIFF//$'\n'/%0A}"
              printf '::notice file=%s,title=Go formatter diff::%s\n' "$FILE" "$FORMAT_DIFF"
            done <<< "$FILES"
            exit 1
          fi

      - name: Vet root module
        if: ${{ !cancelled() && steps.backend_checkout.outcome == 'success' && steps.backend_setup_go.outcome == 'success' && steps.backend_embed.outcome == 'success' }}
        run: go vet ./...

      - name: Vet relaykit independently
        if: ${{ !cancelled() && steps.backend_checkout.outcome == 'success' && steps.backend_setup_go.outcome == 'success' }}
        working-directory: relaykit
        run: go vet ./...

      - name: Vet tokenkit independently
        if: ${{ !cancelled() && steps.backend_checkout.outcome == 'success' && steps.backend_setup_go.outcome == 'success' }}
        working-directory: tokenkit
        run: go vet ./...

      - name: Build root module
        if: ${{ !cancelled() && steps.backend_checkout.outcome == 'success' && steps.backend_setup_go.outcome == 'success' && steps.backend_embed.outcome == 'success' }}
        run: go build ./...

      - name: Build relaykit independently
        if: ${{ !cancelled() && steps.backend_checkout.outcome == 'success' && steps.backend_setup_go.outcome == 'success' }}
        working-directory: relaykit
        run: go build ./...

      - name: Build tokenkit independently
        if: ${{ !cancelled() && steps.backend_checkout.outcome == 'success' && steps.backend_setup_go.outcome == 'success' }}
        working-directory: tokenkit
        run: go build ./...

      - name: Test root, relaykit, and tokenkit modules
        if: ${{ !cancelled() && steps.backend_checkout.outcome == 'success' && steps.backend_setup_go.outcome == 'success' && steps.backend_embed.outcome == 'success' }}
        run: |
          LOG_FILE="$RUNNER_TEMP/backend-tests.log"
          set +e
          make test 2>&1 | tee "$LOG_FILE"
          COMMAND_STATUS=("${PIPESTATUS[@]}")
          set -e
          if [ "${COMMAND_STATUS[0]}" -ne 0 ]; then
            python3 - "$LOG_FILE" <<'PY' || true
          import pathlib
          import re
          import sys

          lines = pathlib.Path(sys.argv[1]).read_text(errors="replace").splitlines()
          if not lines:
              lines = ["Test command failed without output; inspect the step exit code."]
          detail_pattern = re.compile(r"^\s*Error:|panic:|fatal error:|\.go:\d+:\d+:")
          pattern = re.compile(r"--- FAIL:|^FAIL(?:\s|$)|panic:|fatal error:|\.go:\d+:\d+:|^\s*(?:Error Trace|Error|Messages):")
          matches = [i for i, line in enumerate(lines) if pattern.search(line)]
          if not matches:
              matches = [max(0, len(lines) - 12)]
          matches.sort(key=lambda i: not bool(detail_pattern.search(lines[i])))
          contexts = []
          for i in matches:
              if any(start <= i < end for start, end in contexts):
                  continue
              start = max(0, i - 3)
              end = min(len(lines), i + 18)
              contexts.append((start, end))
          for start, end in contexts[:30]:
              message = f"Log lines {start + 1}-{end}:\n" + "\n".join(lines[start:end])
              message = message[:2500].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=Backend test failure::{message}")
          if len(contexts) > 30:
              print(f"::error::{len(contexts) - 30} additional failure contexts are in the backend-test-logs artifact")
          PY
          fi
          if [ "${COMMAND_STATUS[0]}" -ne 0 ]; then
            exit "${COMMAND_STATUS[0]}"
          fi
          exit "${COMMAND_STATUS[1]}"

      - name: Upload backend test logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-test-logs-${{ github.sha }}
          path: ${{ runner.temp }}/backend-tests.log
          if-no-files-found: warn

  relay_policy_integration:
    name: Relay policy, request logs, and database integration
    if: github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GOWORK: 'off'
      TEST_MYSQL_DSN: 'root:integration@tcp(127.0.0.1:3306)/relay_policy?charset=utf8mb4&parseTime=True&loc=Local'
      TEST_POSTGRES_DSN: 'postgres://postgres:integration@127.0.0.1:5432/relay_policy?sslmode=disable'
      TEST_CLICKHOUSE_DSN: 'clickhouse://default:integration@127.0.0.1:9000/relay_policy'
      TEST_REDIS_ADDR: '127.0.0.1:6379'
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: integration
          MYSQL_DATABASE: relay_policy
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pintegration"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: integration
          POSTGRES_DB: relay_policy
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d relay_policy"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      redis:
        image: redis:7.4
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=12
      clickhouse:
        image: clickhouse/clickhouse-server:25.8
        env:
          CLICKHOUSE_DB: relay_policy
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: integration
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: '1'
        ports:
          - 9000:9000
        options: >-
          --health-cmd="clickhouse-client --user default --password integration --query 'SELECT 1'"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    steps:
      - name: Checkout
        id: integration_checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.event.pull_request.base.repo.full_name || github.repository }}
          ref: ${{ github.sha }}

      - name: Set up Go
        id: integration_setup_go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            relaykit/go.sum
            tokenkit/go.sum

      - name: Record database and Redis versions
        run: |
          CI_MYSQL_VERSION=$(docker exec ${{ job.services.mysql.id }} mysql -uroot -pintegration -N -e 'SELECT VERSION()')
          printf '::notice title=MySQL version::%s\n' "$CI_MYSQL_VERSION"
          CI_POSTGRES_VERSION=$(docker exec ${{ job.services.postgres.id }} psql -U postgres -d relay_policy -Atc 'SELECT VERSION()')
          printf '::notice title=PostgreSQL version::%s\n' "$CI_POSTGRES_VERSION"
          CI_REDIS_VERSION=$(docker exec ${{ job.services.redis.id }} redis-server --version)
          printf '::notice title=Redis version::%s\n' "$CI_REDIS_VERSION"
          CI_CLICKHOUSE_VERSION=$(docker exec ${{ job.services.clickhouse.id }} clickhouse-client --user default --password integration --query 'SELECT version()')
          printf '::notice title=ClickHouse version::%s\n' "$CI_CLICKHOUSE_VERSION"

      - name: Verify startup migration from released baseline
        env:
          RELEASED_BASELINE_SHA: 53a71f88d5b568847cd7233a08f934824dcb22d3
          NODE_TYPE: master
        run: |
          set -o pipefail
          OUTPUT_DIR="$RUNNER_TEMP/released-migration"
          LOG_FILE="$OUTPUT_DIR/migration.log"
          RELEASED_DIR="$RUNNER_TEMP/released-baseline"
          mkdir -p "$OUTPUT_DIR/logs"

          echo "Current source: $(git rev-parse HEAD)" | tee -a "$LOG_FILE"
          echo "Released source: $RELEASED_BASELINE_SHA" | tee -a "$LOG_FILE"
          git fetch --no-tags https://github.com/azurekiln2333/new-api.git "$RELEASED_BASELINE_SHA"
          git worktree add --detach "$RELEASED_DIR" "$RELEASED_BASELINE_SHA"
          mkdir -p "$RELEASED_DIR/.github/scripts"
          cp .github/scripts/released_migration_probe.go "$RELEASED_DIR/.github/scripts/"

          docker exec ${{ job.services.mysql.id }} mysql -uroot -pintegration -e 'CREATE DATABASE released_migration_mysql CHARACTER SET utf8mb4'
          docker exec ${{ job.services.postgres.id }} psql -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE released_migration_postgres'

          run_probe() {
            source_dir="$1"
            phase="$2"
            engine="$3"
            dsn="$4"
            sqlite_path="$5"
            manifest="$OUTPUT_DIR/$engine.indexes"
            source_sha="$RELEASED_BASELINE_SHA"
            if [ "$source_dir" = "$GITHUB_WORKSPACE" ]; then
              source_sha="$(git rev-parse HEAD)"
            fi
            echo "Invoking model.InitDB: source=$source_sha engine=$engine phase=$phase" | tee -a "$LOG_FILE"
            echo "COMMAND: (cd $source_dir && SQL_DSN=<engine DSN redacted> SQLITE_PATH=$sqlite_path REDEMPTION_INDEX_MANIFEST=$manifest MIGRATION_LOG_DIR=$OUTPUT_DIR/logs/$engine-$phase-$source_sha go run .github/scripts/released_migration_probe.go $phase)" | tee -a "$LOG_FILE"
            set +e
            (
              cd "$source_dir" || exit
              SQL_DSN="$dsn" \
              SQLITE_PATH="$sqlite_path" \
              REDEMPTION_INDEX_MANIFEST="$manifest" \
              MIGRATION_LOG_DIR="$OUTPUT_DIR/logs/$engine-$phase-$source_sha" \
              go run .github/scripts/released_migration_probe.go "$phase"
            ) 2>&1 | tee -a "$LOG_FILE"
            probe_status=("${PIPESTATUS[@]}")
            set -e
            if [ "${probe_status[0]}" -ne 0 ]; then
              failure_context="$(tail -n 20 "$LOG_FILE")"
              failure_context="${failure_context: -2000}"
              failure_context="${failure_context//%/%25}"
              failure_context="${failure_context//$'\r'/%0D}"
              failure_context="${failure_context//$'\n'/%0A}"
              printf '::error title=Released migration failure::engine=%s phase=%s source=%s%%0A%s\n' "$engine" "$phase" "$source_sha" "$failure_context"
              return "${probe_status[0]}"
            fi
            return "${probe_status[1]}"
          }

          MYSQL_RELEASE_DSN='root:integration@tcp(127.0.0.1:3306)/released_migration_mysql?charset=utf8mb4&parseTime=True&loc=Local'
          POSTGRES_RELEASE_DSN='postgres://postgres:integration@127.0.0.1:5432/released_migration_postgres?sslmode=disable'
          SQLITE_RELEASE_PATH="$OUTPUT_DIR/released-migration.sqlite"

          run_probe "$RELEASED_DIR" seed mysql "$MYSQL_RELEASE_DSN" "$SQLITE_RELEASE_PATH"
          run_probe "$GITHUB_WORKSPACE" verify mysql "$MYSQL_RELEASE_DSN" "$SQLITE_RELEASE_PATH"
          run_probe "$GITHUB_WORKSPACE" verify mysql "$MYSQL_RELEASE_DSN" "$SQLITE_RELEASE_PATH"

          run_probe "$RELEASED_DIR" seed postgres "$POSTGRES_RELEASE_DSN" "$SQLITE_RELEASE_PATH"
          run_probe "$GITHUB_WORKSPACE" verify postgres "$POSTGRES_RELEASE_DSN" "$SQLITE_RELEASE_PATH"
          run_probe "$GITHUB_WORKSPACE" verify postgres "$POSTGRES_RELEASE_DSN" "$SQLITE_RELEASE_PATH"

          run_probe "$RELEASED_DIR" seed sqlite local "$SQLITE_RELEASE_PATH"
          run_probe "$GITHUB_WORKSPACE" verify sqlite local "$SQLITE_RELEASE_PATH"
          run_probe "$GITHUB_WORKSPACE" verify sqlite local "$SQLITE_RELEASE_PATH"

      - name: Upload released migration logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: released-baseline-migration-${{ github.sha }}
          path: ${{ runner.temp }}/released-migration/
          if-no-files-found: warn

      # These packages use process-wide fixtures. Keep them sequential against
      # the isolated service databases, and require configured external engines.
      - name: Verify database contracts, channel settings and relay policies
        if: ${{ !cancelled() && steps.integration_checkout.outcome == 'success' && steps.integration_setup_go.outcome == 'success' }}
        env:
          AUDIT_MYSQL_DSN: ${{ env.TEST_MYSQL_DSN }}
          AUDIT_POSTGRES_DSN: ${{ env.TEST_POSTGRES_DSN }}
          AUDIT_CLICKHOUSE_DSN: ${{ env.TEST_CLICKHOUSE_DSN }}
        run: |
          # Audit fixtures use their own names; missing aliases must fail this
          # required hosted matrix rather than silently skipping real engines.
          : "${AUDIT_MYSQL_DSN:?Required MySQL audit fixture DSN is missing}"
          : "${AUDIT_POSTGRES_DSN:?Required PostgreSQL audit fixture DSN is missing}"
          : "${AUDIT_CLICKHOUSE_DSN:?Required ClickHouse audit fixture DSN is missing}"
          LOG_FILE="$RUNNER_TEMP/database-integration-tests.log"
          set +e
          go test -p 1 -count=1 -v ./model ./service ./controller 2>&1 | tee "$LOG_FILE"
          COMMAND_STATUS=("${PIPESTATUS[@]}")
          set -e
          if [ "${COMMAND_STATUS[0]}" -ne 0 ]; then
            python3 - "$LOG_FILE" <<'PY' || true
          import pathlib
          import re
          import sys

          lines = pathlib.Path(sys.argv[1]).read_text(errors="replace").splitlines()
          if not lines:
              lines = ["Test command failed without output; inspect the step exit code."]
          detail_pattern = re.compile(r"^\s*Error:|panic:|fatal error:|\.go:\d+:\d+:")
          pattern = re.compile(r"--- FAIL:|^FAIL(?:\s|$)|panic:|fatal error:|\.go:\d+:\d+:|^\s*(?:Error Trace|Error|Messages):")
          matches = [i for i, line in enumerate(lines) if pattern.search(line)]
          if not matches:
              matches = [max(0, len(lines) - 12)]
          matches.sort(key=lambda i: not bool(detail_pattern.search(lines[i])))
          contexts = []
          for i in matches:
              if any(start <= i < end for start, end in contexts):
                  continue
              start = max(0, i - 3)
              end = min(len(lines), i + 18)
              contexts.append((start, end))
          for start, end in contexts[:30]:
              message = f"Log lines {start + 1}-{end}:\n" + "\n".join(lines[start:end])
              message = message[:2500].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=Database integration failure::{message}")
          if len(contexts) > 30:
              print(f"::error::{len(contexts) - 30} additional failure contexts are in the database-integration-test-logs artifact")
          PY
          fi
          if [ "${COMMAND_STATUS[0]}" -ne 0 ]; then
            exit "${COMMAND_STATUS[0]}"
          fi
          exit "${COMMAND_STATUS[1]}"

      - name: Upload database integration test logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: database-integration-test-logs-${{ github.sha }}
          path: ${{ runner.temp }}/database-integration-tests.log
          if-no-files-found: warn

      - name: Verify scheduled channel locks on MySQL and PostgreSQL
        if: ${{ !cancelled() && steps.integration_checkout.outcome == 'success' && steps.integration_setup_go.outcome == 'success' }}
        run: |
          for DIALECT in mysql postgres; do
            TEST_TASK_DB_DIALECT=$DIALECT go test -p 1 -count=1 -v ./model -run 'TestScheduledChannel'
            TEST_TASK_DB_DIALECT=$DIALECT go test -p 1 -count=1 -v ./controller -run 'TestExecuteTaskSubmission|TestImmediateTaskSettlementDatabase|TestTaskSubmissionCommits|TestLedgerTaskSubmission|TestLegacyTaskSubmission'
          done

      - name: Verify model availability observations on SQLite, MySQL and PostgreSQL
        if: ${{ !cancelled() && steps.integration_checkout.outcome == 'success' && steps.integration_setup_go.outcome == 'success' }}
        run: |
          for DIALECT in sqlite mysql postgres; do
            TEST_TASK_DB_DIALECT=$DIALECT go test -p 1 -count=1 -v ./model -run '^TestChannelModelUnavailability$'
          done

      - name: Verify channel configuration and key binding on MySQL and PostgreSQL
        if: ${{ !cancelled() && steps.integration_checkout.outcome == 'success' && steps.integration_setup_go.outcome == 'success' }}
        run: |
          for CHANNEL_TEST_DSN in "$TEST_MYSQL_DSN" "$TEST_POSTGRES_DSN"; do
            TEST_CHANNEL_SQL_DSN="$CHANNEL_TEST_DSN" go test -p 1 -count=1 -v ./controller -run 'TestChannelSupportedEndpointsPersistThroughCreateAndUpdate|TestMultiKeyEnableRestoresOnlyExhaustedChannels|TestUpdateChannelKeepsCurrentKeyState|TestUpdateChannelConvertsSingleKeyChannel|TestMultiKeyManageKeepsKeyScopesOnTheirKey|TestMultiKeyModelDiscoveryUsesOneKey|TestMultiKeyModelSyncPreviewAndApply|TestGetChannelConcurrency|TestPlaygroundChannelNavigationAuthorizationAndRouting|TestFingerprintResponsesOnlyChannelProbe'
          done

      - name: Verify console management credentials and policy reloads on MySQL and PostgreSQL
        if: ${{ !cancelled() && steps.integration_checkout.outcome == 'success' && steps.integration_setup_go.outcome == 'success' }}
        run: |
          for CHANNEL_TEST_DSN in "$TEST_MYSQL_DSN" "$TEST_POSTGRES_DSN"; do
            TEST_CHANNEL_SQL_DSN="$CHANNEL_TEST_DSN" go test -p 1 -count=1 -v ./controller -run 'TestCodexWhamChannelManagement|TestChannelManagement|TestPricingSyncChannelManagement|TestChannelDiagnostic|TestFingerprintDiagnostic|TestOllamaChannelManagement'
          done
          for DIALECT in mysql postgres; do
            TEST_TASK_DB_DIALECT=$DIALECT go test -p 1 -count=1 -v ./model -run '^TestUpdateChannelStatusCheckedCacheRouting$'
            TEST_TASK_DB_DIALECT=$DIALECT go test -p 1 -count=1 -v ./service -run '^TestCodexChannelManagement'
          done

      - name: Verify bounded channel reads and atomic channel publication on SQLite, MySQL and PostgreSQL
        if: ${{ !cancelled() && steps.integration_checkout.outcome == 'success' && steps.integration_setup_go.outcome == 'success' }}
        run: |
          for CHANNEL_TEST_DSN in "" "$TEST_MYSQL_DSN" "$TEST_POSTGRES_DSN"; do
            TEST_CHANNEL_SQL_DSN="$CHANNEL_TEST_DSN" go test -p 1 -count=1 -v ./controller -run 'TestChannelSearch|TestGetChannelOptions|TestChannelCreate|TestChannelUpdate|TestChannelCacheReload|TestChannelBoundIndex'
          done

      - name: Verify management operation migrations and durable audit delivery
        if: ${{ !cancelled() && steps.integration_checkout.outcome == 'success' && steps.integration_setup_go.outcome == 'success' }}
        run: >-
          go test -p 1 -count=1 -v ./model
          -run '^(TestManagementMutationOutboxDatabaseMatrix|TestConcurrentCodeBatchSubmitCollapsesToOneBatch|TestAuditOutboxReplayAfterLostAcknowledgement|TestAuditOutboxClickHouseDelivery|TestCodeOperationRecoveryRequiresAuthorization|TestCodeRequestDigestIsUnambiguous|TestCodeExportContractsAcrossDatabase|TestRecordManagementAuditFallsBackWithSameEventIdentity)$'

      - name: Verify invitation registration and code replay on SQLite, MySQL and PostgreSQL
        if: ${{ !cancelled() && steps.integration_checkout.outcome == 'success' && steps.integration_setup_go.outcome == 'success' }}
        run: |
          for DIALECT in sqlite mysql postgres; do
            TEST_SECURITY_DIALECT=$DIALECT go test -p 1 -count=1 -v ./controller -run 'TestInvitation|TestManagementCodeCreateReplaySurvivesExpiry|TestRedemptionBatch'
          done

      - name: Check invitation registration races
        if: ${{ !cancelled() && steps.integration_checkout.outcome == 'success' && steps.integration_setup_go.outcome == 'success' }}
        env:
          CGO_ENABLED: '1'
        run: go test -race -p 1 -count=1 -v ./controller -run 'TestInvitationAtomicRegistration|TestInvitationAffiliate'

      - name: Check management operation and audit delivery races
        if: ${{ !cancelled() && steps.integration_checkout.outcome == 'success' && steps.integration_setup_go.outcome == 'success' }}
        env:
          CGO_ENABLED: '1'
        run: >-
          go test -race -p 1 -count=1 -v ./model
          -run '^(TestManagementMutationOutboxDatabaseMatrix|TestConcurrentCodeBatchSubmitCollapsesToOneBatch|TestAuditOutboxReplayAfterLostAcknowledgement|TestCodeOperationRecoveryRequiresAuthorization)$'

      - name: Verify allocation identity and quota management on MySQL and PostgreSQL
        if: ${{ !cancelled() && steps.integration_checkout.outcome == 'success' && steps.integration_setup_go.outcome == 'success' }}
        run: |
          for CHANNEL_TEST_DSN in "$TEST_MYSQL_DSN" "$TEST_POSTGRES_DSN"; do
            TEST_CHANNEL_SQL_DSN="$CHANNEL_TEST_DSN" go test -p 1 -count=1 -v ./controller -run '^(TestChannelAllocations|TestMultiKeyThreeRowModelScopeEditUsesFreshRevisions|TestManagedKeyAllocation)'
          done

      - name: Verify option batch writes and management settings on SQLite, MySQL and PostgreSQL
        if: ${{ !cancelled() && steps.integration_checkout.outcome == 'success' && steps.integration_setup_go.outcome == 'success' }}
        run: |
          go test -p 1 -count=1 -v ./model -run 'TestUpdateOptionPersistsAcrossDialects|TestUpdateOptionReportsWriteFailure|TestUpdateOptionsBulkIsAtomic|TestOrdinaryOptionsBatch'
          for DIALECT in sqlite mysql postgres; do
            TEST_SECURITY_DIALECT=$DIALECT go test -p 1 -count=1 -v ./controller -run 'TestUpdateOptionRejectsNegativeClaudeDefaultMaxTokens|TestUpdateOptionRejectsInvalidGeminiSafetyThreshold|TestUpdateOptionsBatch'
          done

      - name: Verify recorded subscription balance spending on SQLite, MySQL and PostgreSQL
        if: ${{ !cancelled() && steps.integration_checkout.outcome == 'success' && steps.integration_setup_go.outcome == 'success' }}
        run: go test -p 1 -count=1 -v ./model -run '^(TestSubscriptionBalanceChargedQuota|TestSubscriptionBalanceUsedQuotaDatabaseMatrix)$'

      - name: Verify channel priority transactions and local routing on SQLite, MySQL and PostgreSQL
        if: ${{ !cancelled() && steps.integration_checkout.outcome == 'success' && steps.integration_setup_go.outcome == 'success' }}
        run: go test -p 1 -count=1 -v ./model -run '^TestChannelPriorityDatabaseMatrix$'

      - name: Verify log retention across relational and ClickHouse log stores
        if: ${{ !cancelled() && steps.integration_checkout.outcome == 'success' && steps.integration_setup_go.outcome == 'success' }}
        run: go test -p 1 -count=1 -v ./model -run '^TestLogRequestDetailRetentionDatabaseMatrix$'

      - name: Check request-content settings, retention scheduling and storage access races
        if: ${{ !cancelled() && steps.integration_checkout.outcome == 'success' && steps.integration_setup_go.outcome == 'success' }}
        env:
          CGO_ENABLED: '1'
        run: go test -race -p 1 -count=1 -v ./common ./service ./router -run 'TestRequestContentCapture|TestSystemTaskLogRetention|TestPersonalAccessTokenLogStorageScope'

      - name: Check budget accounting and request log storage races
        if: ${{ !cancelled() && steps.integration_checkout.outcome == 'success' && steps.integration_setup_go.outcome == 'success' }}
        env:
          CGO_ENABLED: '1'
        run: go test -race -p 1 -count=1 ./model -run 'TestChannelBudget|TestLogRequestDetail'

      - name: Check panel critical rate-limit isolation races
        if: ${{ !cancelled() && steps.integration_checkout.outcome == 'success' && steps.integration_setup_go.outcome == 'success' }}
        env:
          CGO_ENABLED: '1'
        run: go test -race -p 1 -count=1 ./middleware ./router -run 'TestCriticalRateLimit|TestPanelCriticalRateLimit|TestRedis.*RateLimiter|TestRedisFixedWindow|TestRedisFailurePolicies|TestGlobalWebRateLimit'

      - name: Check declared text endpoints and administrator channel boundaries
        if: ${{ !cancelled() && steps.integration_checkout.outcome == 'success' && steps.integration_setup_go.outcome == 'success' }}
        env:
          CGO_ENABLED: '1'
        run: go test -race -p 1 -count=1 ./relay ./router -run 'TestChannelSupportedEndpoints|TestChannelEndpoint|TestMessagesEndpoint|TestAdminChannel|TestRankingModelUsage|TestStatusInstances|TestOptionBatch|TestAccessTokenRouteRules'

      - name: Check console forwarding, ingress proof and origin guards
        if: ${{ !cancelled() && steps.integration_checkout.outcome == 'success' && steps.integration_setup_go.outcome == 'success' }}
        env:
          CGO_ENABLED: '1'
        run: go test -race -p 1 -count=1 ./middleware ./service/passkey ./router -run 'TestConfigureTrustedProxies|TestLoadConsoleForwardConfig|TestVerifiedConsoleIngress|TestEffectiveRequestScheme|TestConsoleIngress|TestConsoleForwarder|TestSessionCookieOriginGuard|TestPasskeyOrigin'

      - name: Verify update-source repository configuration
        if: ${{ !cancelled() && steps.integration_checkout.outcome == 'success' && steps.integration_setup_go.outcome == 'success' }}
        run: go test -p 1 -count=1 -v ./setting/system_setting -run 'TestUpdateSource|TestValidateUpdateSourceRepository'

      - name: Verify login avatar updates on MySQL and PostgreSQL
        if: ${{ !cancelled() && steps.integration_checkout.outcome == 'success' && steps.integration_setup_go.outcome == 'success' }}
        run: |
          for DIALECT in mysql postgres; do
            TEST_SECURITY_DIALECT=$DIALECT go test -p 1 -count=1 -v ./controller -run 'TestOAuthLogin.*Avatar|TestUserSettingsPreserveProviderAvatar|TestSecurityLogin'
          done

      - name: Verify API key rotation and custom keys on MySQL and PostgreSQL
        if: ${{ !cancelled() && steps.integration_checkout.outcome == 'success' && steps.integration_setup_go.outcome == 'success' }}
        run: |
          for DIALECT in mysql postgres; do
            TEST_SECURITY_DIALECT=$DIALECT go test -p 1 -count=1 -v ./controller -run 'TestNormalizeCustomTokenKey|TestRotateTokenKey|TestAddToken.*CustomKey|TestTokenKeyUniquenessErrorsStayValueFree'
          done

      - name: Verify per-turn goal routing and channel waiting on SQLite, MySQL and PostgreSQL
        if: ${{ !cancelled() && steps.integration_checkout.outcome == 'success' && steps.integration_setup_go.outcome == 'success' }}
        run: |
          for RESPONSES_TEST_DSN in "" "$TEST_MYSQL_DSN" "$TEST_POSTGRES_DSN"; do
            TEST_RESPONSES_SQL_DSN="$RESPONSES_TEST_DSN" TEST_RESPONSES_LOG_SQL_DSN="$RESPONSES_TEST_DSN" go test -p 1 -count=1 -v ./controller -run 'TestResponsesWebSocketGoalPolicyIsPerTurn|TestGoalTurnPolicyRouting|TestRequestPolicyUpstreamHTTPFailover|TestChannelWaitRouting|TestChannelCapacityFailover|TestChannelBudget'
          done

      - name: Check admission, waiting, streaming and timeout races
        if: ${{ !cancelled() && steps.integration_checkout.outcome == 'success' && steps.integration_setup_go.outcome == 'success' }}
        env:
          CGO_ENABLED: '1'
        run: go test -race -p 1 -count=1 ./service ./controller ./relay/channel ./relay/helper ./relay/channel/openai ./relay/channel/gemini ./relay/channel/ollama ./pkg/perf_metrics -run 'RetryAvoidsFailedChannelsAcrossPrioritiesAndGroups|ChannelCapacity|ChannelWait|ChannelBudget|LedgerTaskSubmission|LegacyTaskSubmission|TaskSubmissionCommits|RelayKeepAliveDuringImagePreparation|ChannelDiagnostic|ChannelManagement|ChannelBalanceManagement|MultiKeyModel|StreamCommit|StreamComment|OaiResponsesStreamHandler|OaiResponsesToChatBufferedStreamHandler|ConvertedStream|ResponsesFailedWork|ResponsesPostOutputTruncation|UpstreamFirstByte|FirstByteTimeout|APIAndFormRequestsInheritClientCancellation|Fingerprint|RecordRedisUsesBackendSnapshotBeforeScheduling|GeminiModel|Ollama'

  frontend:
    name: Frontend typecheck, test, and build
    if: github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.event.pull_request.base.repo.full_name || github.repository }}
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Determine complete change scope
        working-directory: .
        run: bash .github/scripts/check-scope.sh

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun check -b

      - name: Check frontend formatting with protected headers
        shell: bash
        run: |
          mapfile -d '' FILES < <(git -C .. diff --name-only --diff-filter=ACMR -z "$CI_DIFF_BASE" "$GITHUB_SHA" -- 'web/**' | sort -zu)
          for INDEX in "${!FILES[@]}"; do
            FILES[$INDEX]="${FILES[$INDEX]#web/}"
          done
          if [ "${#FILES[@]}" -gt 0 ]; then
            bun run format:check -- "${FILES[@]}"
          fi

      - name: Lint changed frontend files
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          mapfile -d '' FILES < <(git -C .. diff --name-only --diff-filter=ACMR -z "$CI_DIFF_BASE" "$GITHUB_SHA" -- 'web/**/*.ts' 'web/**/*.tsx' 'web/**/*.js' 'web/**/*.jsx' | sort -zu)
          for INDEX in "${!FILES[@]}"; do
            FILES[$INDEX]="${FILES[$INDEX]#web/}"
          done
          if [ "${#FILES[@]}" -gt 0 ]; then
            bun x --no-install oxlint -c .oxlintrc.json "${FILES[@]}"
          fi

      - name: Lint updated console flows
        if: ${{ !cancelled() }}
        run: >-
          bun x --no-install oxlint -c .oxlintrc.json
          src/features/keys/components/api-key-rotate-dialog.tsx
