          expected = {
              "sources": ("github.com/QuantumNous/new-api/service", {
                  "TestFixedPriceBillingDatabaseMatrix", "TestFixedPriceBillingDatabaseMatrix/sqlite", "TestFixedPriceBillingDatabaseMatrix/mysql", "TestFixedPriceBillingDatabaseMatrix/postgres",
                  "TestRelayUsageReportsDatabaseMatrix", "TestRelayUsageReportsDatabaseMatrix/sqlite", "TestRelayUsageReportsDatabaseMatrix/mysql", "TestRelayUsageReportsDatabaseMatrix/postgres",
                  "TestTaskUsageReportsDatabaseMatrix", "TestTaskUsageReportsDatabaseMatrix/sqlite", "TestTaskUsageReportsDatabaseMatrix/mysql", "TestTaskUsageReportsDatabaseMatrix/postgres",
              }),
