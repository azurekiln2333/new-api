                  "TestUsageStatisticsReadersDatabaseMatrix", "TestUsageStatisticsReadersDatabaseMatrix/sqlite", "TestUsageStatisticsReadersDatabaseMatrix/mysql", "TestUsageStatisticsReadersDatabaseMatrix/postgres",
              }),
              "backfill": ("github.com/QuantumNous/new-api/model", {"TestSumUsedQuotaCountsCacheTokensByUsageSemantics", "TestUsageLegacyQuotaDataBaselineIsBoundedAndStable", "TestDeleteOldLogBatchRequiresExactLinkedEventPayload", "TestDeleteOldLogBatchRejectsLegacyNodeMutation", "TestDeleteOldLogBatchRejectsLinkedNodeMutation", "TestUsageEventBackfillBatchResumesAfterTransactionalFailure", "TestUsageEventBackfillBatchResumesAfterTransactionalFailure/sqlite", "TestUsageEventBackfillBatchResumesAfterTransactionalFailure/mysql", "TestUsageEventBackfillBatchResumesAfterTransactionalFailure/postgres"}),
              "retention-service": ("github.com/QuantumNous/new-api/service", {"TestSystemTaskLogRetentionStopsWhenUsageStatisticsAreNotReady", "TestSystemTaskLogRetentionDeletesOnlyAfterLegacyImportAndPreservesUsageTotals"}),
              "retention-model": ("github.com/QuantumNous/new-api/model", {"TestLogRequestDetailRetentionDatabaseMatrix"}),
