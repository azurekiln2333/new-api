name: Generate reviewed locale artifact

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'web/scripts/add-missing-keys.mjs'
      - '.github/workflows/locale-artifact.yml'

permissions:
  contents: read

jobs:
  locales:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout requested snapshot
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.event.pull_request.base.repo.full_name }}
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'

      - name: Apply reviewed translations and synchronize seven locales
        working-directory: web
        run: |
          bun run i18n:sync
          node scripts/add-missing-keys.mjs
          bun run i18n:sync

      - name: Capture source-bound locale patch
        run: |
          mkdir -p "$RUNNER_TEMP/locale-artifact"
          git rev-parse HEAD > "$RUNNER_TEMP/locale-artifact/source-sha.txt"
          git diff --binary -- web/src/i18n/locales/en.json web/src/i18n/locales/zh.json web/src/i18n/locales/zh-TW.json web/src/i18n/locales/fr.json web/src/i18n/locales/ja.json web/src/i18n/locales/ru.json web/src/i18n/locales/vi.json > "$RUNNER_TEMP/locale-artifact/locales.patch"
          cp web/src/i18n/locales/_reports/_sync-report.json "$RUNNER_TEMP/locale-artifact/sync-report.json"

      - name: Upload generated patch for source review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: locales-${{ github.sha }}
          path: ${{ runner.temp }}/locale-artifact/
          if-no-files-found: error
